name: Publish to GitHub Packages

# ignore tags as the untagged commit has the same GITHUB_SHA and would conflict
on:
  push:
    branches:
    - '**'

jobs:
  publish:
    if: github.repository_owner == 'xanox-org'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup local cache directories
        run: |
          mkdir -p ~/.m2/repository
          mkdir -p ~/.m2/wrapper
          mkdir -p web-bundle/node
          mkdir -p web-bundle/node_modules
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
          fail-on-cache-miss: false
      - name: Cache Node.js installation
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-v20.14.0-npm-10.7.0
          restore-keys: |
            ${{ runner.os }}-node-
          fail-on-cache-miss: false
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web-bundle/package-lock.json', 'web-bundle/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
          fail-on-cache-miss: false
      - name: Build and publish package ${{ matrix.java-version }}
        # special 'wagon' option due to https://github.com/orgs/community/discussions/49001
        run: |
          mvn -B versions:set -DnewVersion=$GITHUB_SHA -DgenerateBackupPoms=false
          mvn -Dmaven.resolver.transport=wagon -B -DskipTests -Pskip-shaded-web-jar -Pskip-tools-jar source:jar deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: "-Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
