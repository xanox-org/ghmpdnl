name: Publish to Maven Central

on:
  push:
    tags:
    - '**'

jobs:
  maven-central-publish:
    if: github.repository_owner == 'xanox-org'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup local cache directories
        run: |
          mkdir -p ~/.m2/repository
          mkdir -p ~/.m2/wrapper
          mkdir -p web-bundle/node
          mkdir -p web-bundle/node_modules
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # feed directly as multi line value
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
          fail-on-cache-miss: false
      - name: Cache Node.js installation
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-v20.14.0-npm-10.7.0
          restore-keys: |
            ${{ runner.os }}-node-
          fail-on-cache-miss: false
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web-bundle/package-lock.json', 'web-bundle/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
          fail-on-cache-miss: false
      - name: clean install
        run: |
          mvn -Dkey=$API_KEY clean install -B
        env:
          MAVEN_OPTS: "-Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

      - name: Build and publish package to maven central ${{ matrix.java-version }}
        run: |
          echo "release to maven central"
          mvn -B versions:set -DnewVersion=$GITHUB_REF_NAME -DgenerateBackupPoms=false
          mvn deploy -P release -DskipTests=true -Dpgp.secretkey=keyring:id=0E2FBADB -B
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_OPTS: "-Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
